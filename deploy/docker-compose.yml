# Argus Council: production-style stack.
#   cp deploy/.env.example deploy/.env   # then fill in secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: argus

x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    user: "70:70" # postgres user in the alpine image; avoids granting chown/setuid capabilities
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m

  redis:
    <<: *hardening
    image: redis:7-alpine
    # noeviction: idempotency records, refresh-token revocations and stream tickets must never be
    # evicted (every key has a TTL, so volatile-* policies would evict them too). When memory is
    # full, writes fail instead: the API skips LLM caching, rate-limits per process and answers 503
    # where a record is required (argus/cache/store.py); the RedisMemoryHigh alert fires first.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
      --rename-command FLUSHALL "" --rename-command CONFIG ""
    user: "999:1000" # redis user in the alpine image
    volumes: ["redisdata:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    <<: *hardening
    build:
      context: ../backend
    image: argus-council/api:${ARGUS_VERSION:-latest}
    # Room for uvicorn's graceful shutdown (10 s) plus recording the final status of live runs.
    stop_grace_period: 45s
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    environment:
      ARGUS_ENV: production
      ARGUS_SECRET_KEY: ${ARGUS_SECRET_KEY:?set ARGUS_SECRET_KEY (>=32 chars)}
      ARGUS_DATABASE_URL: postgresql+asyncpg://argus:${POSTGRES_PASSWORD}@postgres:5432/argus
      ARGUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARGUS_CORS_ORIGINS: ${ARGUS_CORS_ORIGINS:-http://localhost:8080}
      # Off unless enabled: the first account can always register (and becomes admin).
      ARGUS_ALLOW_REGISTRATION: ${ARGUS_ALLOW_REGISTRATION:-false}
      ARGUS_BOOTSTRAP_ADMIN_EMAIL: ${ARGUS_BOOTSTRAP_ADMIN_EMAIL:-}
      ARGUS_BOOTSTRAP_ADMIN_PASSWORD: ${ARGUS_BOOTSTRAP_ADMIN_PASSWORD:-}
      ARGUS_ENCRYPTION_KEY: ${ARGUS_ENCRYPTION_KEY:-}
      ARGUS_MCP_ALLOW_STDIO: ${ARGUS_MCP_ALLOW_STDIO:-false}
      # SSRF guard: private/loopback targets for webhooks, MCP servers and remote agents, and for
      # the agents' web_fetch tool, are refused unless enabled. Link-local is always refused.
      ARGUS_CONNECTIONS_ALLOW_PRIVATE_URLS: ${ARGUS_CONNECTIONS_ALLOW_PRIVATE_URLS:-false}
      ARGUS_WEB_FETCH_ALLOW_PRIVATE_URLS: ${ARGUS_WEB_FETCH_ALLOW_PRIVATE_URLS:-false}
      # LLM providers users add themselves (Ollama, vLLM, LM Studio on your network need true).
      # Providers configured here through ARGUS_*_BASE_URL are not affected.
      ARGUS_PROVIDER_ALLOW_PRIVATE_URLS: ${ARGUS_PROVIDER_ALLOW_PRIVATE_URLS:-false}
      ARGUS_METRICS_TOKEN: ${ARGUS_METRICS_TOKEN:-}
      # Retention (0 = keep forever). The ledger is never pruned by default: pruning breaks verification.
      ARGUS_RETENTION_RUN_DAYS: ${ARGUS_RETENTION_RUN_DAYS:-0}
      ARGUS_RETENTION_EVENT_DAYS: ${ARGUS_RETENTION_EVENT_DAYS:-0}
      ARGUS_RETENTION_AUDIT_DAYS: ${ARGUS_RETENTION_AUDIT_DAYS:-365}
      ARGUS_RETENTION_LEDGER_DAYS: ${ARGUS_RETENTION_LEDGER_DAYS:-0}
      ARGUS_DATA_DIR: /data
      # Unix socket on a shared volume: the sandbox container has no network interface at all.
      ARGUS_SANDBOX_URL: unix:/run/argus-sandbox/sandbox.sock
      ARGUS_SANDBOX_TOKEN: ${ARGUS_SANDBOX_TOKEN:?set ARGUS_SANDBOX_TOKEN}
      ARGUS_SEARCH_PROVIDER: ${ARGUS_SEARCH_PROVIDER:-}
      ARGUS_SEARCH_API_KEY: ${ARGUS_SEARCH_API_KEY:-}
      ARGUS_SEARXNG_URL: ${ARGUS_SEARXNG_URL:-}
      # Only the web proxy (and localhost) reach the API, so trust its X-Forwarded-For for client IPs.
      FORWARDED_ALLOW_IPS: "*"
      # System-wide LLM providers (users can also add their own in the UI)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ARGUS_OLLAMA_BASE_URL: ${ARGUS_OLLAMA_BASE_URL:-}
      ARGUS_VLLM_BASE_URL: ${ARGUS_VLLM_BASE_URL:-}
      ARGUS_LMSTUDIO_BASE_URL: ${ARGUS_LMSTUDIO_BASE_URL:-}
    volumes: ["argusdata:/data", "sandboxsock:/run/argus-sandbox"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      sandbox: { condition: service_healthy }
    networks: [backend, frontend]
    ports: ["${ARGUS_API_BIND:-127.0.0.1}:${ARGUS_API_PORT:-8000}:8000"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  web:
    <<: *hardening
    build:
      context: ../frontend
    image: argus-council/web:${ARGUS_VERSION:-latest}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]
    ports: ["${ARGUS_WEB_BIND:-0.0.0.0}:${ARGUS_WEB_PORT:-8080}:8080"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  sandbox:
    <<: *hardening
    image: argus-council/api:${ARGUS_VERSION:-latest}
    command: ["uvicorn", "argus.sandbox.server:app", "--uds", "/run/argus-sandbox/sandbox.sock", "--no-server-header"]
    # Per-execution isolation (argus/sandbox/isolation.py): the server starts as root holding only
    # the capabilities to switch uid and hand files over; every command runs as its own uid from
    # ARGUS_SANDBOX_UID_POOL, so concurrent runs cannot see or touch each other's workspaces or
    # processes. No CAP_DAC_OVERRIDE / CAP_KILL / CAP_SYS_*: commands end up with no capabilities.
    user: "0:0"
    cap_add: ["SETUID", "SETGID", "CHOWN"]
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      # 0711: commands can enter their own 0700 workspace but cannot list or create in /work.
      - "/work:size=512m,mode=0711"
      - "/tmp:size=128m,mode=1777"
    environment:
      ARGUS_RUN_MIGRATIONS: "false"
      ARGUS_SANDBOX_TOKEN: ${ARGUS_SANDBOX_TOKEN}
      ARGUS_SANDBOX_WORKDIR: /work
      ARGUS_SANDBOX_UID_POOL: "20000-20999"
      ARGUS_SANDBOX_SOCKET_DIR: /run/argus-sandbox
    # No network at all: agent code can reach neither the internet nor the API, database or cache.
    # The API talks to the sandbox over a Unix socket on the shared sandboxsock volume.
    network_mode: none
    volumes: ["sandboxsock:/run/argus-sandbox"]
    healthcheck:
      test: ["CMD", "python", "-c", 'import socket,sys; s=socket.socket(socket.AF_UNIX); s.settimeout(4); s.connect("/run/argus-sandbox/sandbox.sock"); s.sendall(b"GET /health HTTP/1.0\r\nHost: sandbox\r\n\r\n"); sys.exit(0 if b" 200 " in s.recv(64) else 1)']
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g, pids: 256 }

volumes:
  pgdata:
  redisdata:
  argusdata:
  sandboxsock:

networks:
  backend:
    internal: true # no egress: database and cache only
  frontend:
