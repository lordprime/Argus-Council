# Argus Council: production-style stack.
#   cp deploy/.env.example deploy/.env   # then fill in secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: argus

x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    user: "70:70" # postgres user in the alpine image; avoids granting chown/setuid capabilities
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
      --rename-command FLUSHALL "" --rename-command CONFIG ""
    user: "999:1000" # redis user in the alpine image
    volumes: ["redisdata:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    <<: *hardening
    build:
      context: ../backend
    image: argus-council/api:${ARGUS_VERSION:-latest}
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    environment:
      ARGUS_ENV: production
      ARGUS_SECRET_KEY: ${ARGUS_SECRET_KEY:?set ARGUS_SECRET_KEY (>=32 chars)}
      ARGUS_DATABASE_URL: postgresql+asyncpg://argus:${POSTGRES_PASSWORD}@postgres:5432/argus
      ARGUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARGUS_CORS_ORIGINS: ${ARGUS_CORS_ORIGINS:-http://localhost:8080}
      ARGUS_ALLOW_REGISTRATION: ${ARGUS_ALLOW_REGISTRATION:-true}
      ARGUS_BOOTSTRAP_ADMIN_EMAIL: ${ARGUS_BOOTSTRAP_ADMIN_EMAIL:-}
      ARGUS_BOOTSTRAP_ADMIN_PASSWORD: ${ARGUS_BOOTSTRAP_ADMIN_PASSWORD:-}
      ARGUS_ENCRYPTION_KEY: ${ARGUS_ENCRYPTION_KEY:-}
      ARGUS_MCP_ALLOW_STDIO: ${ARGUS_MCP_ALLOW_STDIO:-false}
      ARGUS_DATA_DIR: /data
      ARGUS_SANDBOX_URL: http://sandbox:8100
      ARGUS_SANDBOX_TOKEN: ${ARGUS_SANDBOX_TOKEN:?set ARGUS_SANDBOX_TOKEN}
      ARGUS_SEARCH_PROVIDER: ${ARGUS_SEARCH_PROVIDER:-}
      ARGUS_SEARCH_API_KEY: ${ARGUS_SEARCH_API_KEY:-}
      ARGUS_SEARXNG_URL: ${ARGUS_SEARXNG_URL:-}
      # Only the web proxy (and localhost) reach the API, so trust its X-Forwarded-For for client IPs.
      FORWARDED_ALLOW_IPS: "*"
      # System-wide LLM providers (users can also add their own in the UI)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ARGUS_OLLAMA_BASE_URL: ${ARGUS_OLLAMA_BASE_URL:-}
      ARGUS_VLLM_BASE_URL: ${ARGUS_VLLM_BASE_URL:-}
      ARGUS_LMSTUDIO_BASE_URL: ${ARGUS_LMSTUDIO_BASE_URL:-}
    volumes: ["argusdata:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      sandbox: { condition: service_healthy }
    networks: [backend, frontend, sandbox]
    ports: ["${ARGUS_API_BIND:-127.0.0.1}:${ARGUS_API_PORT:-8000}:8000"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  web:
    <<: *hardening
    build:
      context: ../frontend
    image: argus-council/web:${ARGUS_VERSION:-latest}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]
    ports: ["${ARGUS_WEB_BIND:-0.0.0.0}:${ARGUS_WEB_PORT:-8080}:8080"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  sandbox:
    <<: *hardening
    image: argus-council/api:${ARGUS_VERSION:-latest}
    command: ["uvicorn", "argus.sandbox.server:app", "--host", "0.0.0.0", "--port", "8100", "--no-server-header"]
    read_only: true
    tmpfs:
      - "/work:size=512m,mode=1777"
      - "/tmp:size=128m,mode=1777"
    environment:
      ARGUS_RUN_MIGRATIONS: "false"
      ARGUS_SANDBOX_TOKEN: ${ARGUS_SANDBOX_TOKEN}
      ARGUS_SANDBOX_WORKDIR: /work
    networks: [sandbox] # internal only: agent code has no route to the internet or other services
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g, pids: 256 }

volumes:
  pgdata:
  redisdata:
  argusdata:

networks:
  backend:
    internal: true # no egress: database and cache only
  frontend:
  sandbox:
    internal: true
