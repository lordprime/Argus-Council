name: Feature request
description: Suggest something Argus Council should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work from your side: in the UI, the API, a guardrail, a protocol, a skill.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Council runtime (planning, oversight, approvals, votes)
        - Providers and models
        - Tools, sandbox or web research
        - Skills or marketplace
        - Knowledge bases or memory
        - Protocols (MCP, A2A, ACP) or ledger
        - Web UI or run views
        - API, webhooks or auth
        - Deployment, scripts or Docker
        - Documentation
        - Other
    validations:
      required: true
