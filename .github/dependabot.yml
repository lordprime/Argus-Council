# Weekly dependency updates. Minor and patch updates are grouped per ecosystem to keep the
# pull request count down; major updates arrive one by one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  # Hash-pinned MkDocs Material requirements (tools/docs-requirements.in -> .txt)
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
    labels: [dependencies, docs]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    labels: [dependencies, docker]
