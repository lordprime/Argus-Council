name: Docs

# Builds the MkDocs Material site from docs/ with warnings as errors on every pull request
# that touches it, and publishes it to GitHub Pages from main. The OpenAPI document behind
# the API reference is regenerated from the code first, so the published reference always
# matches main.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "tools/docs-requirements.txt"
      - "scripts/gen-openapi.sh"
      - "backend/argus/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "tools/docs-requirements.txt"
      - "scripts/gen-openapi.sh"
      - "backend/argus/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  PYTHONUTF8: "1"
  NO_MKDOCS_2_WARNING: "1"

defaults:
  run:
    shell: bash

jobs:
  docs:
    name: docs (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Regenerate the OpenAPI document from the code
        run: ./scripts/gen-openapi.sh
      - name: Build the documentation site (warnings are errors)
        # Exact, hash-pinned requirements: the build is the same on every run.
        run: uv run --no-project --python 3.13 --with-requirements tools/docs-requirements.txt mkdocs build --strict
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  docs-deploy:
    # The github-pages environment only accepts the default branch, so pull
    # requests validate the build above and main publishes it.
    name: docs (deploy to GitHub Pages)
    needs: [docs]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # OIDC token proving the deployment's origin
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
