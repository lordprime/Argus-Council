name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q --cov=argus --cov-report=term-missing
      - name: Migrations apply and match models (Postgres)
        env:
          ARGUS_DATABASE_URL: postgresql+asyncpg://argus:argus@localhost:5432/argus
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Integration tests (Postgres + Redis)
        env:
          ARGUS_TEST_DATABASE_URL: postgresql+asyncpg://argus:argus@localhost:5432/argus
          ARGUS_TEST_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x --severity=warning scripts/*.sh scripts/tests/*.sh scripts/tests/stubs/*
      - name: Deploy script tests (stub docker)
        run: ./scripts/tests/run.sh

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, scripts]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: argus-council/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: argus-council/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Compose smoke test
        run: |
          cat > deploy/.env <<ENV
          ARGUS_SECRET_KEY=$(python3 -c "import secrets;print(secrets.token_urlsafe(48))")
          POSTGRES_PASSWORD=$(python3 -c "import secrets;print(secrets.token_urlsafe(24))")
          REDIS_PASSWORD=$(python3 -c "import secrets;print(secrets.token_urlsafe(24))")
          ARGUS_SANDBOX_TOKEN=$(python3 -c "import secrets;print(secrets.token_urlsafe(24))")
          ARGUS_VERSION=ci
          ENV
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --wait --wait-timeout 180
          ./scripts/smoke.sh http://127.0.0.1:8000
          ./scripts/smoke.sh http://127.0.0.1:8080
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env exec -T api python - <<'PY'
          import asyncio, os
          from argus.sandbox.client import RemoteSandbox
          sb = RemoteSandbox("http://sandbox:8100", os.environ["ARGUS_SANDBOX_TOKEN"])
          res = asyncio.run(sb.run({"t.py": "print(6*7)"}, "python3 t.py", 30))
          assert res["exit_code"] == 0 and res["stdout"].strip() == "42", res
          net = asyncio.run(sb.run({}, "python3 -c \"import urllib.request; urllib.request.urlopen('https://example.com', timeout=5)\"", 30))
          assert net["exit_code"] != 0, "sandbox must not reach the internet"
          print("sandbox: OK")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: UI end-to-end (production build, strict CSP)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          E2E_BASE=http://127.0.0.1:8080 node e2e/ui-smoke.cjs
      - name: Backup, update, rollback and restore end-to-end (scripts)
        timeout-minutes: 15
        run: ./scripts/tests/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color
      - name: Trivy image vulnerability scan
        # Vulnerabilities only: the secret scanner flags docstring placeholders in third-party
        # SDK packages. Our own source is secret-scanned in the next step.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 \
            image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress \
            argus-council/api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 \
            image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress \
            argus-council/web:ci
      - name: Trivy secret scan (repository source)
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.57.0 \
            fs --scanners secret --exit-code 1 --no-progress --skip-dirs /src/.git --skip-dirs /src/frontend/node_modules \
            --skip-dirs /src/backups --skip-files /src/deploy/.env /src
